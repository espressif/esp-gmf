.pytest_ut_template:
  extends:
    - .target_test_template
  variables:
    IDF_TAG_FLAG: true
    TARGET_DIR_TYPE: "test_apps"
  artifacts:
    when: always
    paths:
      - XUNIT_RESULT.xml
      - "**/pytest_log/**/dut.txt"
      - pytest-embedded/
    reports:
      junit: XUNIT_RESULT.xml
    expire_in: 1 week
  script:
    - cd $CI_PROJECT_DIR
    - pip install pytest pytest-embedded-idf pytest-embedded-serial-esp pytest-rerunfailures pytest-timeout idf_build_apps
    # Run build_apps.py --find as a separate assignment so set -e aborts the job
    # when it crashes (e.g. dependency mismatch). Using `eval "$(...)"` directly
    # would swallow the failure and silently produce an empty APP_LIST.
    - APP_LIST_CMD=$(python ${CI_PROJECT_DIR}/tools/ci/build_apps.py ${TEST_DIR} --find --target-dir-type ${TARGET_DIR_TYPE} --target ${IDF_TARGET} -vv)
    - eval "$APP_LIST_CMD"
    - '[ "${#APP_LIST[@]}" -gt 0 ] || { echo "ERROR APP_LIST is empty, build_apps.py produced no apps"; exit 1; }'
    - pytest "${APP_LIST[@]}"
      --target ${IDF_TARGET}
      --junitxml=XUNIT_RESULT.xml
      --parallel-count 1
      --parallel-index 1
      ${PYTEST_EXTRA_FLAGS}

.pytest_components_dir_template:
  extends:
    - .rules:build:enable-gmf-unit-test
    - .pytest_ut_template
  variables:
    TEST_DIR: ${CI_PROJECT_DIR}/gmf_core
    BUILD_JOB_PREFIX: build_pytest_components_
    IDF_TARGET: esp32s3
  retry: 1

ut_gmf_core_esp32s3:
  extends:
    - .pytest_components_dir_template
    - .matrix_template
  needs:
    - 'build_ut_gmf_core_esp32s3: [v5.5.3, 1/1]'
    - 'build_ut_gmf_core_esp32s3: [release/v6.1, 1/1]'
  variables:
    TEST_DIR: ${CI_PROJECT_DIR}/gmf_core
  tags: [ ESP32S3, ESP_GMF_COMPONENT ]

