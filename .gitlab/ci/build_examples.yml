.build_cmake_template: &build_cmake_template
  stage: build
  image: ${IMAGE}
  tags:
    - multimedia_build
  parallel: 2
  interruptible: true
  dependencies: # set dependencies to null to avoid missing artifacts issue
  variables:
    DEEP_CLONE: "false"
    IDF_FIND_APP_PATH_ARG: "-p"
    SDKCFG_DEFAULTS: "sdkconfig.defaults.$IDF_TARGET"
    BASE_FRAMEWORK_PATH: "${IDF_PATH}"
    BASE_FRAMEWORK: $IDF_REPOSITORY
  artifacts:
    paths:
      - "**/build*/size.json"
      - "**/build*/build_log.txt"
      - "**/build*/*.bin"
      - "**/build*/*.elf"
      - "**/build*/flasher_args.json"
      - "**/build*/flash_project_args"
      - "**/build*/config/sdkconfig.json"
      - "**/build*/sdkconfig"
      - "**/build*/bootloader/*.bin"
      - "**/build*/partition_table/*.bin"
      - "**/build*/srmodels/*.bin"
    when: always
    expire_in: 4 days
  extends:
    - .build_template
  script:
    - python $CI_PROJECT_DIR/tools/ci/esp_bmgr_pre_build.py --target $IDF_TARGET --board $AUDIO_BOARD --project-path ${EXAMPLES_PATH[@]} --target-dir-type ${TARGET_DIR_TYPE}
    - run_cmd python $CI_PROJECT_DIR/tools/ci/build_apps.py ${EXAMPLES_PATH[@]} \
        -t $IDF_TARGET -vv \
        --target-dir-type ${TARGET_DIR_TYPE} \
        --build-dir ${IDF_VERSION_TAG}/build_@t_@w \
        --parallel-count ${parallel##*/} \
        --parallel-index ${parallel%%/*}

build_examples_esp32_lyrat_mini_v1_1:
  extends:
    - .rules:build:protected-merge-requests-pipeline
    - .build_cmake_template
    # 2-shard matrix: 19 esp32 example apps were hitting the 2h CI cap on
    # release/v6.1 IDF; splitting halves wall time to ~1h per shard.
    - .matrix_template_2shard
  variables:
    IDF_TARGET: esp32
    AUDIO_BOARD: lyrat_mini_v1_1

.build_examples_esp32s2_kaluga_v1_2:
  extends:
    - .rules:build:protected-merge-requests-pipeline
    - .build_cmake_template
    - .matrix_template
  variables:
    IDF_TARGET: esp32s2
    AUDIO_BOARD: ''

build_examples_esp32s3_korvo_v2:
  extends:
    - .rules:build:protected-merge-requests-pipeline
    - .build_cmake_template
    # Use 2-shard matrix: esp32s3 example set (~22 apps) was hitting the 2h
    # CI cap with single-shard sequential builds; splitting into 2 parallel
    # runners brings each shard to ~1h.
    - .matrix_template_2shard
  variables:
    IDF_TARGET: esp32s3
    AUDIO_BOARD: esp32_s3_korvo2_v3

build_examples_esp32p4_function_ev:
  extends:
    - .rules:build:protected-merge-requests-pipeline
    - .build_cmake_template
    # 2-shard, release/v6.1-only matrix: 21 p4 example apps were ~53 min on a
    # single runner; splitting halves wall time to ~30 min per shard.
    - .matrix_template_v6_1_2shard
  variables:
    IDF_TARGET: esp32p4
    AUDIO_BOARD: esp32_p4_function_ev

build_examples_esp32s31:
  extends:
    - .rules:build:protected-merge-requests-pipeline
    - .build_cmake_template
    # 2-shard, release/v6.1-only matrix: 22 s31 example apps were hitting the 2h CI
    # cap on release/v6.1 IDF; splitting halves wall time to ~1h per shard.
    - .matrix_template_v6_1_2shard
  variables:
    IDF_TARGET: esp32s31
    AUDIO_BOARD: esp32_s31_korvo1
