dependencies:
  espressif/esp_player:
    version: "^1.0.0"
    override_path: ../../../esp_player
  espressif/gmf_core:
    version: "^0.8"
    override_path: ../../../../gmf_core
  espressif/gmf_io:
    version: "^0.8"
    override_path: ../../../../elements/gmf_io
  espressif/gmf_audio:
    version: "^0.8"
    override_path: ../../../../elements/gmf_audio
  espressif/gmf_video:
    version: "^0.8"
    override_path: ../../../../elements/gmf_video
  espressif/esp_audio_render:
    version: "^0.8.0"
    override_path: ../../../esp_audio_render
  espressif/esp_video_render:
    version: "^0.8"
    override_path: "../../../esp_video_render"
  espressif/gmf_app_utils:
    version: "^0.8"
    override_path: "../../../gmf_app_utils"
  espressif/media_lib_sal:
    version: "^0.9"
  espressif/esp_board_manager:
    version: ">=0.5"
  espressif/esp_hosted:
    matches:
      - if: "idf_version <5.4.0"
        version: "~1.1"
      - if: "idf_version >=5.4.0"
        version: "^2.6.4"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version <=5.4.0"
        version: "~0.4"
      - if: "idf_version >5.4.0, <5.5.0"
        version: "~0.6"
      - if: "idf_version >=5.5.0"
        version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4]"
